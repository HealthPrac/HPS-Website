<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthPrac Solutions — Operational Excellence for Health Practices</title>
<link rel="icon" href="images/hps-emblem.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   HealthPrac Solutions — Operational Excellence for Health Practices
   Med-tech theme: navy-dominant, cool clinical relief, champagne gold,
   electric circuit glow. Type system inherited from HealthPrac brand.
   ========================================================================= */

:root {
  /* ---- Navy depth scale ---- */
  --navy-950: #07142B;
  --navy-900: #0A1A33;
  --navy-850: #0C2143;
  --navy-800: #0F2547;
  --navy-700: #173461;
  --navy-600: #20457C;

  /* ---- Cool clinical relief ---- */
  --mist:    #EEF3F9;
  --mist-2:  #F6F9FC;
  --cloud:   #E4EBF4;
  --steel:   #CDD8E6;
  --white:   #FFFFFF;

  /* ---- Ink for light surfaces ---- */
  --ink:   #142239;
  --ink-2: #46566E;
  --ink-3: #7C8DA6;

  /* ---- Text on navy ---- */
  --on-navy:   #E9EEF6;
  --on-navy-2: rgba(233,238,246,0.72);
  --on-navy-3: rgba(233,238,246,0.48);

  /* ---- Champagne gold ---- */
  --gold:   #B98729;
  --gold-2: #D8A833;
  --gold-3: #F0DA9C;
  --gold-bg: rgba(185,135,41,0.14);

  /* ---- Tech glow ---- */
  --glow:      #4E8FD6;
  --glow-soft: rgba(78,143,214,0.42);
  --glow-line: rgba(110,165,225,0.55);

  --circuit: 0.5;

  --rule-navy: rgba(233,238,246,0.12);
  --rule-light: #DCE4EF;

  --accent: #B98729;
  --radius: 4px;
  --max: 1280px;

  --t-fast: 180ms;
  --t-mid:  340ms;
  --t-slow: 620ms;
  --ease:   cubic-bezier(.2,.7,.2,1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--navy-900);
  color: var(--on-navy);
  font-family: "Geist", system-ui, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
.serif { font-family: "Poppins", system-ui, sans-serif; }
.mono  { font-family: "Geist Mono", ui-monospace, monospace; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

.wrap { max-width: var(--max); margin: 0 auto; padding: 0 56px; }
@media (max-width: 820px) { .wrap { padding: 0 24px; } }

/* =========================================================================
   TYPE PRIMITIVES
   ========================================================================= */
.eyebrow {
  font-family: "Geist Mono", monospace; font-size: 11px;
  color: var(--accent); letter-spacing: 0.18em; text-transform: uppercase;
  margin: 0 0 20px; display: inline-flex; align-items: center; gap: 12px;
}
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); opacity: .8; }

.display {
  font-family: "Poppins", system-ui, sans-serif;
  font-weight: 300; line-height: 1.0; letter-spacing: -0.025em;
  margin: 0; color: var(--on-navy);
}
.display em { font-style: normal; font-weight: 500; color: var(--gold-2); }

.mono-label {
  font-family: "Geist Mono", monospace; font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}

/* sections on light surfaces */
.on-light { background: var(--mist); color: var(--ink); }
.on-light .display { color: var(--navy-800); }
.on-light .display em { color: var(--gold); }
.on-light .eyebrow { color: var(--gold); }
.on-light .eyebrow::before { background: var(--gold); }

/* =========================================================================
   BUTTONS
   ========================================================================= */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "Geist", sans-serif; font-weight: 500; font-size: 14px;
  letter-spacing: 0.005em; padding: 13px 22px; border-radius: var(--radius);
  border: 1px solid transparent; transition: all var(--t-fast) var(--ease);
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn .arrow { font-family: "Geist Mono", monospace; transition: transform var(--t-fast) var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }

.btn.gold { background: var(--accent); color: var(--navy-900); border-color: var(--accent); }
.btn.gold:hover { background: var(--gold-2); box-shadow: 0 8px 28px -10px var(--glow-soft); }
.btn.outline-light { background: transparent; color: var(--on-navy); border-color: rgba(233,238,246,0.28); }
.btn.outline-light:hover { border-color: var(--gold-2); color: var(--gold-2); }
.btn.navy { background: var(--navy-800); color: var(--on-navy); border-color: var(--navy-800); }
.btn.navy:hover { background: var(--navy-700); }
.btn.outline-dark { background: transparent; color: var(--navy-800); border-color: rgba(15,37,71,0.3); }
.btn.outline-dark:hover { border-color: var(--gold); color: var(--gold); }

/* =========================================================================
   REVEAL
   ========================================================================= */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity 720ms var(--ease), transform 720ms var(--ease); }
.reveal.in { opacity: 1; transform: translateY(0); }

/* =========================================================================
   CIRCUIT BACKDROP
   ========================================================================= */
.circuit-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.circuit-bg svg { position: absolute; width: 100%; height: 100%; opacity: var(--circuit); }
.circuit-bg .glow-blob {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: calc(var(--circuit) * 0.9);
}

/* =========================================================================
   NAV
   ========================================================================= */
.nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(10,26,51,0.72);
  backdrop-filter: saturate(150%) blur(14px);
  -webkit-backdrop-filter: saturate(150%) blur(14px);
  border-bottom: 1px solid var(--rule-navy);
}
.nav-inner {
  max-width: var(--max); margin: 0 auto; padding: 16px 56px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 32px; align-items: center;
}
@media (max-width: 1000px) { .nav-inner { padding: 14px 24px; } }
.logo { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.logo img { width: 30px; height: 30px; }
.logo .wm { display: flex; flex-direction: row; align-items: baseline; gap: 5px; line-height: 1; }
.logo .wm b { font-family: "Poppins", system-ui, sans-serif; font-weight: 700; font-size: 21px; color: var(--on-navy); letter-spacing: -0.01em; }
.logo .wm i { font-family: "Poppins", system-ui, sans-serif; font-style: normal; font-weight: 700; font-size: 21px; color: var(--gold-2); letter-spacing: -0.01em; }

.nav-items { display: flex; gap: 2px; justify-content: center; align-items: center; }
.nav-item {
  font-family: "Geist", sans-serif; font-weight: 500; font-size: 14px;
  color: var(--on-navy-2); padding: 9px 14px; background: transparent; border: 0;
  transition: color var(--t-fast) var(--ease);
}
.nav-item:hover { color: var(--gold-2); }
.nav-cta { display: flex; gap: 10px; align-items: center; }
@media (max-width: 1000px) { .nav-items { display: none; } }

/* =========================================================================
   HERO
   ========================================================================= */
.hero { position: relative; padding: 92px 0 104px; overflow: hidden; background: var(--navy-900); }
.hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1.05fr 1fr; gap: 64px; align-items: center; }
@media (max-width: 1000px) { .hero-grid { grid-template-columns: 1fr; gap: 56px; } }
.hero-h1 { font-size: clamp(46px, 6vw, 86px); }
.hero-sub { max-width: 480px; margin: 30px 0 36px; color: var(--on-navy-2); font-size: 17px; line-height: 1.65; }
.hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-meta { margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--rule-navy); display: flex; gap: 40px; flex-wrap: wrap; }
.hero-meta .item { font-family: "Geist Mono", monospace; font-size: 10px; color: var(--on-navy-3); letter-spacing: 0.12em; text-transform: uppercase; }
.hero-meta .item strong { display: block; color: var(--gold-2); font-family: "Poppins", system-ui, sans-serif; font-size: 30px; letter-spacing: 0; text-transform: none; margin-bottom: 4px; font-weight: 400; }

/* ---- Hero dashboard mock ---- */
.console {
  position: relative;
  background: linear-gradient(160deg, rgba(23,52,97,0.55), rgba(10,26,51,0.65));
  border: 1px solid rgba(120,165,225,0.22);
  border-radius: 14px;
  padding: 14px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.06) inset,
    0 40px 90px -40px rgba(0,0,0,0.7),
    0 0 60px -30px var(--glow-soft);
  backdrop-filter: blur(6px);
}
.console-bar { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
.console-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(233,238,246,0.18); }
.console-bar .dot.g { background: var(--gold); }
.console-bar .title { margin-left: 6px; font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--on-navy-2); text-transform: uppercase; }
.console-bar .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: "Geist Mono", monospace; font-size: 9px; letter-spacing: 0.14em; color: var(--glow); text-transform: uppercase; }
.console-bar .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.console-screen { background: rgba(7,20,43,0.6); border: 1px solid var(--rule-navy); border-radius: 8px; overflow: hidden; }
.console-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 18px 12px; }
.console-head .h { font-family: "Poppins", system-ui, sans-serif; font-size: 21px; color: var(--on-navy); font-weight: 500; }
.console-head .sub { font-family: "Geist Mono", monospace; font-size: 9px; color: var(--on-navy-3); letter-spacing: 0.12em; text-transform: uppercase; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule-navy); border-top: 1px solid var(--rule-navy); border-bottom: 1px solid var(--rule-navy); }
.kpi { background: rgba(15,37,71,0.4); padding: 14px 16px; }
.kpi .k { font-family: "Geist Mono", monospace; font-size: 8.5px; letter-spacing: 0.14em; color: var(--on-navy-3); text-transform: uppercase; }
.kpi .v { font-family: "Poppins", system-ui, sans-serif; font-size: 30px; line-height: 1; color: var(--on-navy); margin-top: 8px; font-weight: 400; }
.kpi .v em { font-style: normal; color: var(--gold-2); }
.kpi .v.glow { color: var(--glow); }
.kpi .d { font-family: "Geist Mono", monospace; font-size: 8.5px; color: var(--on-navy-3); margin-top: 4px; letter-spacing: 0.06em; }
.console-rows { padding: 8px 18px 16px; }
.crow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule-navy); }
.crow:last-child { border-bottom: 0; }
.crow .name { font-size: 12px; color: var(--on-navy-2); }
.crow .time { font-family: "Geist Mono", monospace; font-size: 10px; color: var(--on-navy-3); }
.crow .tag { font-family: "Geist Mono", monospace; font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; }
.tag.ok   { background: rgba(78,143,214,0.16); color: var(--glow); }
.tag.gold { background: var(--gold-bg); color: var(--gold-2); }
.tag.mut  { background: rgba(233,238,246,0.07); color: var(--on-navy-3); }
.console-foot { display: flex; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--rule-navy); font-family: "Geist Mono", monospace; font-size: 9px; letter-spacing: 0.1em; color: var(--on-navy-3); text-transform: uppercase; }
.console-foot em { color: var(--gold-2); font-style: normal; }

/* =========================================================================
   PROOF STRIP
   ========================================================================= */
.proof { padding: 26px 0; border-top: 1px solid var(--rule-navy); border-bottom: 1px solid var(--rule-navy); background: var(--navy-850); }
.proof-row { display: flex; justify-content: center; align-items: center; gap: 38px; flex-wrap: wrap; font-family: "Geist Mono", monospace; font-size: 11px; letter-spacing: 0.16em; color: var(--on-navy-3); text-transform: uppercase; }
.proof-row .label { color: var(--on-navy-2); display: inline-flex; align-items: center; gap: 9px; }
.proof-row .label::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }

/* =========================================================================
   SECTION RHYTHM
   ========================================================================= */
section.block { padding: 104px 0; position: relative; overflow: hidden; }
@media (max-width: 820px) { section.block { padding: 72px 0; } }
.section-head { max-width: 760px; margin-bottom: 60px; }
.section-head h2 { font-family: "Poppins", system-ui, sans-serif; font-weight: 300; font-size: clamp(38px, 4.8vw, 62px); line-height: 1.04; letter-spacing: -0.022em; margin: 0; color: var(--on-navy); }
.on-light .section-head h2 { color: var(--navy-800); }
.section-head h2 em { font-style: normal; font-weight: 500; color: var(--gold-2); }
.on-light .section-head h2 em { color: var(--gold); }
.section-head p { font-size: 17px; line-height: 1.65; margin: 22px 0 0; max-width: 56ch; }
.section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
.section-head.center .eyebrow { justify-content: center; }

/* =========================================================================
   PAIN -> SOLUTION
   ========================================================================= */
.relief-list { display: grid; gap: 1px; background: var(--rule-light); border: 1px solid var(--rule-light); border-radius: var(--radius); overflow: hidden; }
.relief-row { display: grid; grid-template-columns: 56px 1fr 1.15fr; gap: 28px; background: var(--mist-2); padding: 30px 32px; align-items: center; transition: background var(--t-mid) var(--ease); }
.relief-row:hover { background: var(--white); }
@media (max-width: 800px) { .relief-row { grid-template-columns: 1fr; gap: 14px; padding: 26px 24px; } }
.relief-row .num { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--gold); letter-spacing: 0.12em; }
.relief-row .pain { display: flex; flex-direction: column; gap: 6px; }
.relief-row .pain .k { font-family: "Geist Mono", monospace; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.relief-row .pain .t { font-family: "Poppins", system-ui, sans-serif; font-size: 23px; line-height: 1.18; color: var(--navy-800); font-weight: 500; }
.relief-row .fix { display: flex; flex-direction: column; gap: 6px; padding-left: 28px; border-left: 1px solid var(--rule-light); }
@media (max-width: 800px) { .relief-row .fix { padding-left: 0; border-left: 0; padding-top: 14px; border-top: 1px solid var(--rule-light); } }
.relief-row .fix .k { font-family: "Geist Mono", monospace; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); display: inline-flex; align-items: center; gap: 8px; }
.relief-row .fix .k::before { content: "→"; }
.relief-row .fix .d { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
.relief-row .fix .d b { color: var(--navy-800); font-weight: 600; }

/* =========================================================================
   MODULE GRID
   ========================================================================= */
.module-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule-navy); border: 1px solid var(--rule-navy); border-radius: var(--radius); overflow: hidden; }
@media (max-width: 1000px) { .module-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .module-grid { grid-template-columns: 1fr; } }
.module-card { background: var(--navy-850); padding: 30px 26px 28px; display: flex; flex-direction: column; gap: 13px; min-height: 248px; cursor: pointer; transition: background var(--t-mid) var(--ease); position: relative; overflow: hidden; }
.module-card::after { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); transition: width var(--t-mid) var(--ease); }
.module-card:hover { background: var(--navy-800); }
.module-card:hover::after { width: 100%; }
.module-card .top { display: flex; justify-content: space-between; align-items: center; }
.module-card .num { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--accent); letter-spacing: 0.14em; }
.module-card .ic { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--rule-navy); border-radius: 7px; color: var(--gold-2); background: rgba(120,165,225,0.06); }
.module-card .ic svg { width: 18px; height: 18px; }
.module-card h3 { font-family: "Poppins", system-ui, sans-serif; font-weight: 500; font-size: 25px; line-height: 1.08; color: var(--on-navy); margin: 4px 0 0; }
.module-card p { margin: 0; color: var(--on-navy-2); font-size: 13.5px; line-height: 1.6; }
.module-card .link { font-family: "Geist Mono", monospace; font-size: 10px; color: var(--gold-2); letter-spacing: 0.1em; text-transform: uppercase; margin-top: auto; padding-top: 8px; display: inline-flex; align-items: center; gap: 7px; transition: gap var(--t-fast) var(--ease); }
.module-card:hover .link { gap: 13px; }
.module-card .link::after { content: "→"; }

/* =========================================================================
   HOW IT WORKS
   ========================================================================= */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule-light); border: 1px solid var(--rule-light); border-radius: var(--radius); overflow: hidden; }
@media (max-width: 900px) { .steps { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
.step { background: var(--mist-2); padding: 34px 28px; min-height: 230px; display: flex; flex-direction: column; gap: 14px; transition: background var(--t-mid) var(--ease); }
.step:hover { background: var(--white); }
.step .n { font-family: "Poppins", system-ui, sans-serif; font-size: 50px; line-height: 0.9; color: var(--navy-800); font-weight: 300; }
.step .n em { font-style: normal; color: var(--gold); }
.step .k { font-family: "Geist Mono", monospace; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); padding-bottom: 12px; border-bottom: 1px solid var(--rule-light); }
.step h3 { font-family: "Poppins", system-ui, sans-serif; font-weight: 500; font-size: 22px; line-height: 1.12; color: var(--navy-800); margin: 0; }
.step p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }

/* =========================================================================
   OUTCOMES
   ========================================================================= */
.outcomes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule-navy); border: 1px solid var(--rule-navy); border-radius: var(--radius); overflow: hidden; }
@media (max-width: 800px) { .outcomes { grid-template-columns: 1fr 1fr; } }
.outcome { background: var(--navy-850); padding: 40px 30px; display: flex; flex-direction: column; gap: 10px; }
.outcome .v { font-family: "Poppins", system-ui, sans-serif; font-size: clamp(48px, 5vw, 66px); line-height: 0.95; color: var(--on-navy); font-weight: 300; }
.outcome .v em { font-style: normal; color: var(--gold-2); font-weight: 400; }
.outcome .k { font-family: "Geist Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-navy-3); padding-top: 12px; border-top: 1px solid var(--rule-navy); }

/* =========================================================================
   PARTNER / TESTIMONIAL
   ========================================================================= */
.partner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
@media (max-width: 950px) { .partner-grid { grid-template-columns: 1fr; gap: 44px; } }
.partner-quote { font-family: "Poppins", system-ui, sans-serif; font-style: normal; font-weight: 300; font-size: clamp(26px, 3vw, 38px); line-height: 1.28; color: var(--navy-800); margin: 0; }
.partner-quote .hl { font-style: normal; color: var(--gold); }
.partner-cite { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 26px; display: flex; flex-direction: column; gap: 4px; }
.partner-cite b { color: var(--navy-800); font-weight: 600; letter-spacing: 0.06em; }
.partner-steps { display: flex; flex-direction: column; gap: 0; }
.partner-steps .ps { display: grid; grid-template-columns: 30px 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid var(--rule-light); }
.partner-steps .ps .n { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.1em; }
.partner-steps .ps .t b { font-family: "Geist", sans-serif; font-weight: 600; font-size: 14.5px; color: var(--navy-800); display: block; margin-bottom: 3px; }
.partner-steps .ps .t span { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }

/* =========================================================================
   CLOSING CTA
   ========================================================================= */
.close-cta { text-align: center; padding: 128px 0; position: relative; overflow: hidden; background: var(--navy-950); }
.close-cta .inner { position: relative; z-index: 2; }
.close-cta h2 { font-family: "Poppins", system-ui, sans-serif; font-weight: 300; font-size: clamp(42px, 6vw, 84px); line-height: 1.0; letter-spacing: -0.025em; color: var(--on-navy); margin: 0 auto; max-width: 18ch; }
.close-cta h2 em { font-style: normal; font-weight: 500; color: var(--gold-2); }

/* ── Modal shell ── */
function ModalShell({ title, tag, onClose, children, footerNote }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", esc);
      document.body.style.overflow = "";
    };
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <div>
            <h3 dangerouslySetInnerHTML={{ __html: title }} />
            <div className="modal-tag">{tag}</div>
          </div>
          <button className="modal-close" onClick={onClose} aria-label="Close">✕</button>
        </div>
        <div className="modal-body">{children}</div>
        {footerNote && <div className="modal-footer">{footerNote}</div>}
      </div>
    </div>
  );
}

function BField({ label, k, type = "text", placeholder, data, errs, set, optional }) {

      <label>{label} {!optional && <span className="req">*</span>}</label>

/* ── Book-a-call modal ── */
function BookCallModal({ onClose }) {
  const [step, setStep] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [data, setData] = useState({ name: "", email: "", role: "", org: "", segment: "", sites: "", currentSystems: "", focus: [], notes: "" });
  const [errs, setErrs] = useState({});
  const [sending, setSending] = useState(false);
  const [sendErr, setSendErr] = useState("");

  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [onClose]);

  const set = (k) => (e) => {
    const val = e && e.target ? e.target.value : e;
    setData((d) => ({ ...d, [k]: val }));
    if (errs[k]) setErrs((s) => ({ ...s, [k]: null }));
  };

  function toggleFocus(id) {
    setData((d) => {
      const next = d.focus.includes(id) ? d.focus.filter((x) => x !== id) : [...d.focus, id];
      return { ...d, focus: next };
    });
    if (errs.focus) setErrs((s) => ({ ...s, focus: null }));
  }

  function validate(s) {
    const e = {};
    if (s === 0) {
      if (!data.name.trim()) e.name = "Required.";
      if (!data.email.trim()) e.email = "Required.";
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) e.email = "Use a valid work email.";
      if (!data.role.trim()) e.role = "Required.";
    }
    if (s === 1) {
      if (!data.org.trim()) e.org = "Required.";
      if (!data.segment) e.segment = "Pick the closest match.";
      if (!data.sites) e.sites = "Required.";
    }
    if (s === 2) {
      if (!data.focus.length) e.focus = "Select at least one area.";
    }
    setErrs(e);
    return Object.keys(e).length === 0;
  }

  function next() { if (validate(step)) setStep((s) => Math.min(s + 1, 3)); }
  function back() { setStep((s) => Math.max(s - 1, 0)); }

  async function submit() {
    if (!validate(2)) return;
    setSending(true); setSendErr("");
    try {
      const res = await fetch("https://main.d2rogr2lbyrjz1.amplifyapp.com/api/book-call", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: data.name.trim(), email: data.email.trim().toLowerCase(),
          role: data.role.trim(), org: data.org.trim(),
          segment: data.segment, sites: data.sites,
          focus: data.focus.map((id) => FOCUS_OPTIONS.find((o) => o.id === id)?.label || id).join(", "),
          currentSystems: data.currentSystems.trim() || undefined,
          notes: data.notes.trim() || undefined,
        }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || "Something went wrong. Please try again.");
      setSubmitted(true); setStep(3);
    } catch (err) {
      setSendErr(err.message || "Failed to send. Please try again.");
    } finally {
      setSending(false);
    }
  }

  const stepNames = ["About you", "Your practice", "Focus areas"];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box book-modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-header">
          <div>
            <h3>Book a call to explore</h3>
            <div className="modal-tag">HealthPrac Solutions · Healthcare Practices</div>
          </div>
          <button className="modal-close" onClick={onClose} aria-label="Close">✕</button>
        </div>

        {!submitted ? (
          <div className="modal-body">
            <div className="book-form">
              <div className="book-side">
                <h2>A 45-minute conversation.<br/><em>Then we both decide.</em></h2>
                <p>You will speak to one of our partners. We listen to the operating model, the pressure points, and the practice context. We show the platform against your actual workflows.</p>
                <ul>
                  <li>One conversation, one decision — no follow-up sequences.</li>
                  <li>If we're not the right partner, we say so on the call.</li>
                  <li>Confidential under POPIA-compliant terms.</li>
                </ul>
              </div>
              <div className="book-main">
                <div className="book-step-indicators">
                  {stepNames.map((n, i) => (
                    <div key={n} className={`bsi ${i === step ? "active" : ""} ${i < step ? "done" : ""}`}>
                      <span className="n">{String(i + 1).padStart(2, "0")}</span>
                      <span className="lbl">{n}</span>
                    </div>
                  ))}
                </div>

                {step === 0 && (
                  <>
                    <div className="book-step-title">About you.</div>
                    <BField label="Your name" k="name" data={data} errs={errs} set={set} />
                    <BField label="Work email" k="email" type="email" data={data} errs={errs} set={set} />
                    <BField label="Your role" k="role" placeholder="Practice owner, COO, Operations manager…" data={data} errs={errs} set={set} />
                    <div className="book-actions">
                      <button className="book-back" disabled>← Back</button>
                      <button className="btn gold" onClick={next}>Continue <span className="arrow">→</span></button>
                    </div>
                  </>
                )}

                {step === 1 && (
                  <>
                    <div className="book-step-title">Your practice.</div>
                    <BField label="Practice name" k="org" placeholder="e.g. Riverside Family Practice" data={data} errs={errs} set={set} />
                    <div className="bfield">
                      <label>Practice type <span className="req">*</span></label>
                      <div className="brad-group">
                        {SEGMENTS_HP.map((s) => (
                          <button type="button" key={s.id}
                            className={`brad-card ${data.segment === s.id ? "selected" : ""}`}
                            onClick={() => set("segment")(s.id)}>{s.name}</button>
                        ))}
                      </div>
                      {errs.segment && <span className="berr">{errs.segment}</span>}
                    </div>
                    <div className="bfield">
                      <label>Number of sites <span className="req">*</span></label>
                      <div className="brad-group" style={{ gridTemplateColumns: "repeat(4,1fr)" }}>
                        {["1", "2–4", "5–10", "10+"].map((opt) => (
                          <button type="button" key={opt}
                            className={`brad-card ${data.sites === opt ? "selected" : ""}`}
                            onClick={() => set("sites")(opt)}
                            style={{ textAlign: "center", fontFamily: "Poppins, sans-serif", fontSize: 18 }}>{opt}</button>
                        ))}
                      </div>
                      {errs.sites && <span className="berr">{errs.sites}</span>}
                    </div>
                    <BField label="Current systems (optional)" k="currentSystems" placeholder="e.g. GoodX, in-house spreadsheets…" data={data} errs={errs} set={set} optional />
                    <div className="book-actions">
                      <button className="book-back" onClick={back}>← Back</button>
                      <button className="btn gold" onClick={next}>Continue <span className="arrow">→</span></button>
                    </div>
                  </>
                )}

                {step === 2 && (
                  <>
                    <div className="book-step-title">Focus areas.</div>
                    <div className="bfield">
                      <label>What to cover <span className="req">*</span> <span style={{ color: "var(--on-navy-3)", textTransform: "none", letterSpacing: 0 }}>— select all that apply</span></label>
                      <div className="brad-group">
                        {FOCUS_OPTIONS.map((opt) => (
                          <button type="button" key={opt.id}
                            className={`brad-card ${data.focus.includes(opt.id) ? "selected" : ""}`}
                            onClick={() => toggleFocus(opt.id)}>{opt.label}</button>
                        ))}
                      </div>
                      {errs.focus && <span className="berr">{errs.focus}</span>}
                    </div>
                    <div className="bfield">
                      <label>Anything else we should know (optional)</label>
                      <textarea value={data.notes} onChange={set("notes")}
                        placeholder="A regulator visit on the horizon? A site opening? Tell us in your own words." />
                    </div>
                    <div className="book-actions">
                      <button className="book-back" onClick={back} disabled={sending}>← Back</button>
                      <button className="btn gold" onClick={submit} disabled={sending}>
                        {sending ? "Sending…" : <><span>Send request</span><span className="arrow">→</span></>}
                      </button>
                    </div>
                    {sendErr && <p style={{ marginTop: 10, color: "#e74c3c", fontSize: 12.5, lineHeight: 1.5 }}>{sendErr}</p>}
                  </>
                )}
              </div>
            </div>
          </div>
        ) : (
          <div className="book-success">
            <div className="bmark">✓</div>
            <h2><em>Thank you,</em> {data.name.split(" ")[0]}.</h2>
            <p>We have your details. One of our partners will be in touch within one working day to confirm a time — usually the same week. The conversation is 45 minutes, by video or in person.</p>
            <div className="book-review">
              <div className="rl">What you sent</div>
              <div className="brev-row"><span className="k">Name</span><span className="v">{data.name}</span></div>
              <div className="brev-row"><span className="k">Email</span><span className="v">{data.email}</span></div>
              <div className="brev-row"><span className="k">Role</span><span className="v">{data.role}</span></div>
              <div className="brev-row"><span className="k">Practice</span><span className="v">{data.org}</span></div>
              <div className="brev-row"><span className="k">Type</span><span className="v">{SEGMENTS_HP.find((s) => s.id === data.segment)?.name || "—"}</span></div>
              <div className="brev-row"><span className="k">Sites</span><span className="v">{data.sites}</span></div>
              <div className="brev-row"><span className="k">Focus</span><span className="v">{data.focus.map((id) => FOCUS_OPTIONS.find((o) => o.id === id)?.label || id).join(", ")}</span></div>
              {data.currentSystems && <div className="brev-row"><span className="k">Systems</span><span className="v">{data.currentSystems}</span></div>}
              {data.notes && <div className="brev-row"><span className="k">Notes</span><span className="v">{data.notes}</span></div>}
            </div>
            <div style={{ marginTop: 24 }}>
              <button className="btn outline-light" onClick={onClose}>Close</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

/* ── Reveal ── */
function Reveal({ children, delay = 0, as: As = "div", className = "", style = {} }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.top < (window.innerHeight || 800) * 0.95) { setVis(true); return; }
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVis(true); io.disconnect(); } },
      { threshold: 0.08, rootMargin: "0px 0px -6% 0px" }
    );
    io.observe(el);
    const failsafe = setTimeout(() => setVis(true), 600);
    return () => { io.disconnect(); clearTimeout(failsafe); };
  }, []);
  return (
    <As ref={ref} className={`reveal ${vis ? "in" : ""} ${className}`}
      style={{ ...style, opacity: 1, transform: vis ? "translateY(0)" : "translateY(20px)", transition: "transform 720ms cubic-bezier(.2,.7,.2,1)", transitionDelay: vis ? `${delay}ms` : "0ms" }}>
      {children}
    </As>
  );
}
